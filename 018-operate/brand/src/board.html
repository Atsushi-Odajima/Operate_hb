<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1536px;height:1024px;background:#fff;font-family:'Hiragino Sans','Noto Sans JP','IPAGothic',sans-serif;color:#0B1A33;position:relative;overflow:hidden}
.bg{position:absolute;right:-220px;top:-260px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E0F2FE,#EFF6FF 55%,#fff 70%)}
.top{position:absolute;left:84px;top:64px;width:1368px}
.logo{height:112px}
.one{font-size:42px;font-weight:800;margin:26px 0 10px;white-space:nowrap}
.sub{font-size:26px;color:#334155}
.pains{position:absolute;left:84px;top:372px;right:84px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pain{border:2px solid #E2E8F0;border-radius:22px;padding:24px 22px;display:flex;gap:14px;align-items:center;font-size:26px;font-weight:800;line-height:1.4;background:#fff;white-space:nowrap}
.pain svg{flex:none}
.row{position:absolute;left:84px;right:84px;display:grid;gap:18px}
.h{position:absolute;left:84px;font-size:22px;font-weight:800;color:#1D4ED8;letter-spacing:.12em}
.scenes{top:600px;grid-template-columns:repeat(4,1fr)}
.scene{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:800;padding:14px 18px;border-radius:18px;background:#F6F8FB}
.feats{top:760px;grid-template-columns:repeat(5,1fr)}
.feat{border-left:5px solid;border-image:linear-gradient(#22D3EE,#2563EB,#1E3A8A) 1;padding:6px 0 6px 16px;font-size:24px;font-weight:800;line-height:1.35}
.icons{position:absolute;right:84px;top:880px;display:flex;align-items:center;gap:18px;font-size:18px;color:#475569}
.icons img{width:84px;height:84px;border-radius:20px;box-shadow:0 2px 10px rgba(15,23,42,.15)}
.foot{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(90deg,#22D3EE,#2563EB,#1E3A8A)}
.msg{position:absolute;left:84px;top:905px;font-size:20px;color:#475569;letter-spacing:.18em;font-weight:700}
</style></head><body>
<div class="bg"></div>

<div class="icons"><span>PWAアプリアイコン</span><img src="../app-icon-512.png" alt=""><img src="../app-icon-dark-512.png" alt=""></div>
